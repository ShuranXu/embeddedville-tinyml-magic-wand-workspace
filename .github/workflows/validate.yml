name: Validate public workspace
on:
  pull_request:
  push:
    branches: [main]
    tags: ["1.2.0"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.11", cache: pip, cache-dependency-path: training/requirements.txt}
      - run: python -m pip install --requirement training/requirements.txt
      - run: chmod +x lab scripts/*.sh
      - run: python3 tests/validate_workspace.py
      - run: python3 -m unittest discover -s tests -v
      - run: ./scripts/readiness.sh
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
